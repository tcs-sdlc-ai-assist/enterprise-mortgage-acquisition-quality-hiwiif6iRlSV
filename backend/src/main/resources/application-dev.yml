spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.example.makqcrp: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      sla:
        http.server.requests: 10ms,50ms,100ms,200ms,500ms,1s,2s,5s,10s
      http.server.requests:
        percentiles-histogram: true
        percentiles: 0.5,0.9,0.95,0.99
        max: 1000000000
  tracing:
    sampling:
      probability: 1.0
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    display-request-duration: true
    filter: true
    show-common-extensions: true
    try-it-out-enabled: true
    persist-authorization: true
    display-query-params-without-amperstand: true
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    default-model-heading: Model
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    show-extensions: true
    show-common-extensions: true
    try-it-out-enabled: true
    syntax-highlight:
      activated: true
      theme: agate
  show-actuator: true
  group-configs:
    - group: public
      paths-to-match: /**
      packages-to-scan: com.example.makqcrp.controller
  paths-to-match: /api/**
  swagger-ui:
    use-root-path: true
    display-request-duration: true
    filter: true
    show-common-extensions: true
    try-it-out-enabled: true
    persist-authorization: true
    display-query-params-without-amperstand: true
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    default-model-heading: Model
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    show-extensions: true
    show-common-extensions: true
    try-it-out-enabled: true
    syntax-highlight:
      activated: true
      theme: agate
  api-docs:
    path: /v3/api-docs
    groups:
      enabled: true
  swagger-ui:
    oauth:
      redirect-url: http://localhost:8080/oauth2-redirect.html
      client-id: makqcrp
      client-secret: secret
      realm: MakqCRP
      app-name: MakqCRP
      scope-separator: ' '
      scopes: openid,profile,email,roles
  cache:
    disabled: true
  writer:
    with-order-by-key: false
  disable-swagger-default-url: true
  use-root-path: true
  add-security-requirements: true
  security-config:
    - oauth2:
        name: OAuth2
        flows:
          authorizationCode:
            authorization-url: http://localhost:8080/oauth/authorize
            token-url: http://localhost:8080/oauth/token
            refresh-url: http://localhost:8080/oauth/token
            scopes:
              read: read access
